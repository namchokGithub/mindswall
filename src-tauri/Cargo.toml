[package]
name = "mindswall-desktop"
version = "0.1.0"
description = "MindsWall desktop wallpaper manager"
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mindswall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
mindswall-core = { path = "../crates/core" }
directories = "6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
tauri-plugin-global-shortcut = "2.4.1"
