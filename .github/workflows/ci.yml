name: CI

on:
  push:
    # Tags run the same checks through the release workflow.
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      skip_installer:
        description: Skip the installer job when the caller builds its own.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      # Type-checks and builds ui/dist, which src-tauri requires to compile.
      - name: Build frontend
        run: npm --prefix ui run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  installer:
    name: Build NSIS installer
    needs: check
    if: ${{ !inputs.skip_installer }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      # Runs the Tauri CLI from ui/node_modules; its beforeBuildCommand
      # (npm.cmd run build) builds the frontend before the release build.
      - name: Build installer
        run: npm --prefix ui run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mindswall-nsis-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
