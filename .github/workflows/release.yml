name: Release

# Runs when a version tag such as v0.2.0 is pushed. It builds MindsWall Setup,
# the NSIS installer, and the portable ZIP, and attaches them to a draft
# GitHub Release. Publishing the draft stays a manual step.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      skip_installer: true

  build:
    name: Build release artifacts
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that the tag matches every version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $found = @{
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'ui/package.json'           = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
            'installer/tauri.conf.json' = (Get-Content installer/tauri.conf.json -Raw | ConvertFrom-Json).version
            'installer/ui/package.json' = (Get-Content installer/ui/package.json -Raw | ConvertFrom-Json).version
          }
          foreach ($manifest in 'crates/core/Cargo.toml', 'crates/cli/Cargo.toml', 'src-tauri/Cargo.toml', 'installer/Cargo.toml') {
            $line = Select-String -Path $manifest -Pattern '^version = "(.+)"' | Select-Object -First 1
            $found[$manifest] = $line.Matches[0].Groups[1].Value
          }
          $wrong = $found.GetEnumerator() | Where-Object { $_.Value -ne $version }
          if ($wrong) {
            $wrong | ForEach-Object { Write-Error "$($_.Key) has version $($_.Value), expected $version" }
            exit 1
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
            Write-Error "CHANGELOG.md has no section for $version"
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            installer/ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix ui
          npm ci --prefix installer/ui

      - name: Build installer and desktop app
        run: npm --prefix ui run tauri build

      - name: Build CLI
        run: cargo build --release --locked -p mindswall-cli

      # MindsWall Setup embeds the release app built above.
      - name: Build MindsWall Setup
        shell: pwsh
        run: |
          npm --prefix installer/ui run build
          $env:MINDSWALL_APP_EXE = (Resolve-Path target/release/mindswall-desktop.exe).Path
          cargo build --release --locked -p mindswall-setup

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force dist/portable, dist/release | Out-Null
          Copy-Item target/release/mindswall-desktop.exe dist/portable/MindsWall.exe
          Copy-Item target/release/mindswall.exe dist/portable/mindswall.exe
          Copy-Item LICENSE, README.md dist/portable/
          # This file makes the build portable: settings, history, logs, and
          # caches are kept in config, data, and cache folders next to it.
          @(
            'MindsWall portable build.'
            ''
            'While this file is next to MindsWall.exe, the app keeps its settings,'
            'history, logs, and caches in the config, data, and cache folders here'
            'instead of %APPDATA% and %LOCALAPPDATA%. Delete this file to use the'
            'per-user folders instead. Keep the folder somewhere you can write to.'
          ) | Set-Content dist/portable/portable.txt -Encoding utf8
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/release/MindsWall_${version}_x64_portable.zip"
          Copy-Item target/release/mindswall-setup.exe "dist/release/MindsWall_${version}_x64-setup.exe"
          # The NSIS installer stays available while MindsWall Setup is new.
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "dist/release/MindsWall_${version}_x64-nsis-setup.exe"
          }
          Get-ChildItem dist/release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/release/SHA256SUMS.txt -Encoding ascii

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = [regex]::Escape('${{ github.ref_name }}'.TrimStart('v'))
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " |
            Where-Object { $_ -match "^\[$version\]" } |
            Select-Object -First 1
          $changes = ($notes -replace "^\[$version\][^\r\n]*\r?\n", '').Trim()
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          # Every release states that the builds are unsigned.
          $download = @"
          ## Downloads

          - ``MindsWall_<version>_x64-setup.exe``: MindsWall Setup, the per-user installer (no administrator rights needed)
          - ``MindsWall_<version>_x64-nsis-setup.exe``: the previous NSIS installer, if MindsWall Setup does not work for you
          - ``MindsWall_<version>_x64_portable.zip``: portable build; extract it and run ``MindsWall.exe``
          - ``SHA256SUMS.txt``: checksums for both files
          - **Source code** (zip / tar.gz): added by GitHub

          > [!WARNING]
          > These builds are **not code-signed**. Windows SmartScreen may show
          > "Windows protected your PC", Smart App Control may block them, and
          > antivirus software may scan or quarantine them. Check the SHA-256
          > checksum first, then select **More info** > **Run anyway**. See
          > [Installing MindsWall]($repo/blob/main/docs/installing.md)
          > for the steps, or build from source.
          "@ -replace '<version>', '${{ github.ref_name }}'.TrimStart('v') -replace '(?m)^          ', ''
          "$changes`n`n$download" | Set-Content dist/notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mindswall-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/release/* --draft --verify-tag --title "MindsWall ${{ github.ref_name }}" --notes-file dist/notes.md
