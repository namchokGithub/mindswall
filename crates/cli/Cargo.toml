[package]
name = "mindswall-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "mindswall"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
directories = "6.0.0"
mindswall-core = { path = "../core" }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
